<text x="90" y="486" font-size="13" font-weight="700" fill="#1f2430">補足</text>
<text x="90" y="508" font-size="12" fill="#1f2430">・「部屋情報登録画面」「部屋情報登録管理」はクラスとしては既に用意されていたが、対応するメッセージ（相互作用）が</text>
<text x="90" y="530" font-size="12" fill="#1f2430">　コラボレーション図に一つも描かれていなかった（自己レビューで検出した課題）。本図はその欠落分を補完したもの</text>
<text x="90" y="552" font-size="12" fill="#1f2430">・メッセージの内容は RoomRegistrationManager.registerRoom() の実装</text>
<text x="90" y="574" font-size="12" fill="#1f2430">　（findMatchingRoomType → createRoomType → createRoom）に基づく</text>
</svg>